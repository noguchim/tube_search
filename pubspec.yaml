name: tube_search
description: youtube search
publish_to: 'none'
version: 2.1.3+39

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.20.2
  webview_flutter: ^4.4.1
  # 👆 他の依存関係をここに書く
  logger: ^2.0.2
  shared_preferences: ^2.2.2
  provider: ^6.0.5
  google_mobile_ads: ^5.1.0
  flutter_keyboard_visibility: ^6.0.0
  connectivity_plus: ^6.0.3
  in_app_purchase: ^3.1.11
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.0
  flutter_launcher_icons: ^0.13.1
  youtube_player_iframe: ^5.1.2
  flutter_custom_tabs: ^2.2.1
  package_info_plus: ^8.0.0
  in_app_review: ^2.0.8
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.0
  flutter_local_notifications: ^17.0.0
  uuid: ^4.5.1
  device_info_plus: 10.1.2

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_android: "assets/icon/app_icon_android.png"
  remove_alpha_ios: true

  # Android 13 (adaptive icon)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_android.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700

  generate: true

dev_dependencies:
  flutter_native_splash: ^2.4.4
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_icon.png
  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_icon.png
    icon_background_color: "#FFFFFF"
